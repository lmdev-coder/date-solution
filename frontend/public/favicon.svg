<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="fur" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#c8ced4"/>
      <stop offset="100%" stop-color="#8a929b"/>
    </radialGradient>
    <radialGradient id="earIn" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ffa4be"/>
      <stop offset="100%" stop-color="#ed7f9f"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8fd0f7"/>
      <stop offset="100%" stop-color="#2f7fc4"/>
    </radialGradient>
  </defs>

  <!-- ears -->
  <polygon points="34,44 26,16 52,30" fill="url(#fur)"/>
  <polygon points="94,44 102,16 76,30" fill="url(#fur)"/>
  <polygon points="36,40 30,22 46,32" fill="url(#earIn)"/>
  <polygon points="92,40 98,22 82,32" fill="url(#earIn)"/>

  <!-- head -->
  <ellipse cx="64" cy="72" rx="44" ry="42" fill="url(#fur)"/>

  <!-- white inverted-T muzzle: vertical blaze up to mid-eye, chin bar below -->
  <rect x="57" y="60" width="14" height="28" rx="6" fill="#ffffff"/>
  <rect x="42" y="84" width="44" height="12" rx="6" fill="#ffffff"/>

  <!-- big blue eyes, slightly lower -->
  <ellipse cx="46" cy="60" rx="11" ry="13" fill="url(#eye)"/>
  <ellipse cx="82" cy="60" rx="11" ry="13" fill="url(#eye)"/>
  <ellipse cx="46" cy="60" rx="5.5" ry="8.5" fill="#1b1b2f"/>
  <ellipse cx="82" cy="60" rx="5.5" ry="8.5" fill="#1b1b2f"/>
  <circle cx="42" cy="54" r="2.6" fill="#ffffff"/>
  <circle cx="78" cy="54" r="2.6" fill="#ffffff"/>
  <circle cx="49" cy="65" r="1.4" fill="#ffffff"/>
  <circle cx="85" cy="65" r="1.4" fill="#ffffff"/>

  <!-- nose, above the mouth -->
  <path d="M58 80 L70 80 L64 88 Z" fill="#f58cb0" stroke="#d96a93" stroke-width="1"/>

  <!-- mouth, at the level of the horizontal chin bar -->
  <path d="M64 88 Q64 93 57 94 M64 88 Q64 93 71 94" stroke="#8a929b" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- whiskers -->
  <g stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.9">
    <line x1="20" y1="80" x2="42" y2="84"/>
    <line x1="20" y1="88" x2="42" y2="92"/>
    <line x1="108" y1="80" x2="86" y2="84"/>
    <line x1="108" y1="88" x2="86" y2="92"/>
  </g>
</svg>